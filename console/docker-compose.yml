services:
  console:
    build:
      context: ..
      dockerfile: console/Dockerfile.console
    image: frp-console:dev
    ports:
      - "8080:8080"
    environment:
      CONSOLE_LISTEN: ":8080"
      CONSOLE_DB: "/data/console.db"
      CONSOLE_JWT_SECRET: "change-me-jwt-secret"
      CONSOLE_MASTER_KEY: "change-me-32-byte-master-key!!"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # 客户端机器上单独部署；此处示例
  agent:
    build:
      context: ..
      dockerfile: console/Dockerfile.agent
    image: frp-console-agent:dev
    environment:
      CONSOLE_URL: "ws://console:8080/api/agent/ws"
      AGENT_TOKEN: "set-me"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles: ["agent"]
